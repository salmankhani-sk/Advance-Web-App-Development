<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Search Users</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
</head>
<body class="container py-4">
  <h1 class="mb-3">Search Submitted Users</h1>
  <p class="text-muted">Enter either an <strong>ID</strong> or a <strong>Name</strong>. Leave the other blank.</p>

  <form action="search.php" method="GET" class="row gy-3">
    <div class="col-md-3">
      <label for="id" class="form-label">ID</label>
      <input type="number" class="form-control" id="id" name="id" min="1" placeholder="e.g., 3" />
    </div>

    <div class="col-md-5">
      <label for="name" class="form-label">Name (full or part)</label>
      <input type="text" class="form-control" id="name" name="name" maxlength="100" placeholder="e.g., Salman" />
    </div>

    <div class="col-md-4 d-flex align-items-end">
      <button type="submit" class="btn btn-primary me-2">Search</button>
      <a href="search.html" class="btn btn-secondary">Clear</a>
    </div>
  </form>

  <hr class="my-4">

  <p class="text-muted">Results will open on the next page.</p>
</body>
</html>
