<!DOCTYPE html>
<html>
<head>
    <title>Admin</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

    <h1 class="mb-4">Registered Users</h1>
    <p class="text-muted">Read users data from database</p>

    <!-- Error Message -->
    <div id="error" class="alert alert-danger d-none"></div>

    <!-- Users Table -->
    <table class="table table-striped table-bordered shadow">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Gender</th>
                <th>Interests</th>
                <th>Country</th>
                <th>Created</th>
            </tr>
        </thead>
        <tbody id="rows">
            <tr>
                <td colspan="7" class="text-center">Loading...</td>
            </tr>
        </tbody>
    </table>

    <script>
        async function loadRows() {
            const tbody = document.getElementById('rows');
            const error = document.getElementById('error');

            error.classList.add('d-none'); // hide error at start
            tbody.innerHTML = '<tr><td colspan="7" class="text-center">Loading...</td></tr>';

            try {
                // 👇 fetch PHP file that returns <tr> rows
                const res = await fetch('admin.php', { headers: { 'Accept': 'text/html' } });
                if (!res.ok) throw new Error('HTTP ' + res.status);

                const html = await res.text();
                tbody.innerHTML = html || '<tr><td colspan="7" class="text-center">No record</td></tr>';
            } catch (e) {
                tbody.innerHTML = '';
                error.textContent = 'Failed to load data from server.';
                error.classList.remove('d-none');
                console.error(e);
            }
        }

        // Load rows when page opens
        loadRows();
    </script>

    <!-- Bootstrap JS (optional, for future enhancements) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
